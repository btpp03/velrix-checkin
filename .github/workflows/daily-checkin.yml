name: Velrix 每日签到

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 每日签到
        id: checkin
        env:
          VELRIX_COOKIE: ${{ secrets.VELRIX_COOKIE }}
        run: |
          chmod +x ./checkin.sh
          ./checkin.sh

      - name: 查余额
        id: balance
        env:
          VELRIX_COOKIE: ${{ secrets.VELRIX_COOKIE }}
        run: |
          BALANCE=$(curl -s "https://api.velrix.net/v1/economy/balance" \
            -H "Cookie: ${VELRIX_COOKIE}" \
            -H "Origin: https://www.velrix.net" \
            -H "User-Agent: Mozilla/5.0" | jq -r '.data.balance // "?"')
          echo "balance=$BALANCE" >> $GITHUB_OUTPUT

      - name: Telegram 通知
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG not configured, skipping"
            exit 0
          fi
          STATUS="${{ steps.checkin.outcome }}"
          BALANCE="${{ steps.balance.outputs.balance }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ Velrix 签到成功"
          else
            MSG="❌ Velrix 签到失败"
          fi
          MSG="${MSG}%0A💰 当前积分: ${BALANCE}"
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}&text=${MSG}"