name: Velrix 每日签到

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 每日签到（多账号）
        id: checkin
        env:
          VELRIX_COOKIES: ${{ secrets.VELRIX_COOKIES }}
          VELRIX_COOKIE: ${{ secrets.VELRIX_COOKIE }}
        run: |
          chmod +x ./checkin.sh
          ./checkin.sh

      - name: Telegram 通知
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG not configured, skipping"
            exit 0
          fi
          STATUS="${{ steps.checkin.outcome }}"
          SUMMARY="${{ steps.checkin.outputs.summary }}"
          if [ "$STATUS" = "success" ]; then
            TITLE="✅ Velrix 签到完成"
          else
            TITLE="⚠️ Velrix 签到（部分失败）"
          fi
          MSG="${TITLE}%0A${SUMMARY}"
          # 转义换行
          MSG=$(echo "$MSG" | sed 's/\\n/%0A/g')
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}&text=${MSG}"
