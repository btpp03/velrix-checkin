name: Velrix 每日签到

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 每日签到
        id: checkin
        env:
          VELRIX_COOKIE: ${{ secrets.VELRIX_COOKIE }}
        run: |
          chmod +x ./checkin.sh
          ./checkin.sh

      - name: Telegram 通知
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG not configured, skipping"
            exit 0
          fi
          STATUS="${{ steps.checkin.outcome }}"
          BALANCE="${{ steps.checkin.outputs.balance }}"
          CHECKIN_RESULT="${{ steps.checkin.outputs.result }}"
          if [ -z "$BALANCE" ] || [ "$BALANCE" = "unknown" ]; then
            BALANCE="?"
          fi
          if [ "$STATUS" = "success" ] && [ "$CHECKIN_RESULT" = "claimed" ]; then
            MSG="✅ Velrix 签到成功 (+50)"
          elif [ "$STATUS" = "success" ] && [ "$CHECKIN_RESULT" = "already_claimed" ]; then
            MSG="ℹ️ Velrix 今天已签过"
          else
            MSG="❌ Velrix 签到失败"
          fi
          MSG="${MSG}%0A💰 当前积分: ${BALANCE}"
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}&text=${MSG}"